<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I love you &lt;3</title>
  <!-- Importamos la fuente cursiva elegante (Great Vibes) y Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: rgb(8, 8, 10);
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* TAP ultra minimalista adaptable para móviles */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 8, 10, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 1.2s ease;
    }
    #overlay h1 {
      color: rgb(250, 250, 255);
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 12px;
      opacity: 0.6;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- Interfaz inicial minimalista -->
  <div id="overlay" onclick="startExperience()">
    <h1>TAP</h1>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" loop preload="auto">
    <source src="kaikai_mp3.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let WIDTH = canvas.width = window.innerWidth;
    let HEIGHT = canvas.height = window.innerHeight;

    // Ajuste responsivo automático si giran el celular o cambia la ventana
    window.addEventListener('resize', () => {
      WIDTH = canvas.width = window.innerWidth;
      HEIGHT = canvas.height = window.innerHeight;
      updateScale();
    });

    const BACKGROUND_COLOR = "rgb(8, 8, 10)";
    
    // Escala dinámica según si es pantalla de celular o PC
    let SCALE = 24;
    let Y_OFFSET = 50;

    function updateScale() {
      if (WIDTH < 600) {
        SCALE = 16; // Escala más compacta para que el corazón quepa bien en celulares
        Y_OFFSET = 30;
      } else {
        SCALE = 24;
        Y_OFFSET = 60;
      }
    }
    updateScale();

    const WORDS = [
      "I love you", "I love you", "I love you", "love you", "love you",
      "Je t'aime", "Ti amo", "Ich liebe dich", "Eu te amo", 
      "愛してる", "사랑해", "Я тебя люблю", "我爱你", 
      "Σ' αγαπώ", "אהוב אותך", "أحبك", "Seni seviyorum"
    ];
    
    const CENTER_TEXT = "I Love You";
    
    const COLORS = [
      "rgb(255, 255, 255)",
      "rgb(235, 235, 245)",
      "rgb(200, 200, 215)",
      "rgb(250, 250, 255)",
      "rgb(215, 215, 230)"
    ];

    class Particle {
      constructor(x, y, order, kind) {
        this.x = x;
        this.y = y;
        this.order = order;
        this.kind = kind;
        this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.alpha = 0;
        this.flicker = Math.random() * Math.PI * 2;
        this.delay = 0;
        this.size_mult = Math.random() * 0.3 + 0.85;
        this.fontSize = kind === "outline" ? (WIDTH < 600 ? 13 : 18) : (WIDTH < 600 ? 11 : 15);
      }
    }

    function heartXY(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y: -y };
    }

    function toScreen(x, y) {
      return {
        x: x * SCALE + WIDTH / 2,
        y: y * SCALE + HEIGHT / 2 + Y_OFFSET
      };
    }

    // Minicorazones de nieve adaptados
    function drawMiniHeart(ctx, x, y, size, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgb(255, 255, 255)";
      ctx.shadowColor = "rgb(220, 220, 240)";
      ctx.shadowBlur = 5;
      ctx.beginPath();
      let topCurveHeight = size * 0.3;
      ctx.moveTo(x, y + topCurveHeight);
      ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + size, x, y + size);
      ctx.bezierCurveTo(x, y + size, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
      ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function buildOutlineParticles(n_outline, min_gap = 18) {
      const particles = [];
      const placed = [];
      for (let i = 0; i < n_outline; i++) {
        const t = (i / n_outline) * 2 * Math.PI;
        const pos = heartXY(t);
        const screenPos = toScreen(pos.x, pos.y);
        
        let overlap = false;
        for (let p of placed) {
          if (Math.hypot(screenPos.x - p.x, screenPos.y - p.y) < min_gap) {
            overlap = true;
            break;
          }
        }
        if (overlap) continue;
        
        placed.push(screenPos);
        particles.push(new Particle(screenPos.x, screenPos.y, i, "outline"));
      }
      return particles;
    }

    function buildFillParticles(n_fill, min_gap = 24) {
      const particles = [];
      const placed = [];
      let attempts = 0;
      let max_attempts = n_fill * 100;

      while (particles.length < n_fill && attempts < max_attempts) {
        attempts++;
        const t = Math.random() * 2 * Math.PI;
        const r = Math.random() * 0.9;
        const pos = heartXY(t);
        const px = pos.x * r;
        const py = pos.y * r;
        const screenPos = toScreen(px, py);

        let overlap = false;
        for (let q of placed) {
          if (Math.hypot(screenPos.x - q.x, screenPos.y - q.y) < min_gap) {
            overlap = true;
            break;
          }
        }
        if (overlap) continue;

        placed.push(screenPos);
        particles.push(new Particle(screenPos.x, screenPos.y, Math.floor(Math.random() * 250), "fill"));
      }
      return particles;
    }

    let outline = buildOutlineParticles(250);
    let fill = buildFillParticles(200);

    let outline_span = outline.length > 0 ? Math.max(...outline.map(p => p.order)) : 0;
    let frames_per_step = 1.8;
    let fill_start_frame = Math.floor(outline_span * frames_per_step) + 35;

    fill.forEach(p => p.delay = fill_start_frame + p.order);
    outline.forEach(p => p.delay = Math.floor(p.order * frames_per_step));

    let particles = [...outline, ...fill];
    let frame = 0;
    let animationStarted = false;

    let heartSnow = [];
    for(let i = 0; i < 80; i++) {
      heartSnow.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: Math.random() * 3 + 2,
        speedY: Math.random() * 0.5 + 0.2,
        speedX: Math.random() * 0.3 - 0.15,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function startExperience() {
      if (animationStarted) return;
      animationStarted = true;

      const music = document.getElementById('bgMusic');
      music.volume = 1.0;
      music.play().catch(e => console.log("Audio error:", e));

      const overlay = document.getElementById('overlay');
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 1200);

      requestAnimationFrame(animate);
    }

    function drawBackground() {
      ctx.fillStyle = BACKGROUND_COLOR;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      heartSnow.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > HEIGHT) {
          p.y = -10;
          p.x = Math.random() * WIDTH;
        }
        drawMiniHeart(ctx, p.x, p.y, p.size, p.alpha);
      });

      if (!animationStarted) {
        requestAnimationFrame(drawBackground);
      }
    }
    drawBackground();

    function animate() {
      ctx.fillStyle = BACKGROUND_COLOR;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      heartSnow.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > HEIGHT) {
          p.y = -10;
          p.x = Math.random() * WIDTH;
        }
        drawMiniHeart(ctx, p.x, p.y, p.size, p.alpha);
      });

      frame += 0.85;

      particles.forEach(p => {
        if (frame > p.delay && p.alpha < 255) {
          p.alpha = Math.min(255, p.alpha + 10);
        }

        let flick = p.alpha >= 255 ? 0.8 + 0.2 * Math.sin(frame * 0.04 + p.flicker) : 1.0;
        let alpha = Math.floor(p.alpha * flick);
        if (alpha <= 0) return;

        ctx.save();
        ctx.font = `400 ${Math.floor(p.fontSize * p.size_mult)}px 'Quicksand', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const reverbLayers = [
          { dx: -3, dy: -1.5, op: 0.1 },
          { dx: 3, dy: 1.5, op: 0.1 }
        ];

        reverbLayers.forEach(rev => {
          ctx.globalAlpha = (alpha / 255) * rev.op;
          ctx.fillStyle = "rgb(210, 210, 230)";
          ctx.fillText(p.word, p.x + rev.dx, p.y + rev.dy);
        });

        ctx.globalAlpha = alpha / 255;
        if (alpha > 10) {
          ctx.shadowColor = "rgb(255, 255, 255)";
          ctx.shadowBlur = 12;
        }

        ctx.fillStyle = p.color;
        ctx.fillText(p.word, p.x, p.y);
        ctx.restore();
      });

      // Texto central adaptado para pantallas pequeñas
      let center_start = fill_start_frame + 200;
      if (frame > center_start) {
        let progress = Math.min(1.0, (frame - center_start) / 70);
        let center_alpha = Math.floor(255 * (1 - Math.exp(-progress * 7)));
        let pulse = 1.0 + 0.02 * Math.sin(frame * 0.04);

        let centralFontSize = WIDTH < 600 ? 45 : 75;

        ctx.save();
        ctx.font = `normal ${Math.floor(centralFontSize * pulse)}px 'Great Vibes', cursive`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const centerReverb = [
          { dx: -6, dy: -4, op: 0.08, blur: 12 },
          { dx: 6, dy: 4, op: 0.08, blur: 12 },
          { dx: -2, dy: -2, op: 0.18, blur: 25 },
          { dx: 2, dy: 2, op: 0.18, blur: 25 }
        ];

        centerReverb.forEach(rev => {
          ctx.globalAlpha = (center_alpha / 255) * rev.op;
          ctx.fillStyle = "rgb(220, 220, 240)";
          ctx.shadowColor = "rgb(255, 255, 255)";
          ctx.shadowBlur = rev.blur;
          ctx.fillText(CENTER_TEXT, WIDTH / 2 + rev.dx, HEIGHT / 2 + Y_OFFSET + rev.dy);
        });

        ctx.globalAlpha = center_alpha / 255;
        if (center_alpha > 10) {
          ctx.shadowColor = "rgb(255, 255, 255)";
          ctx.shadowBlur = 35;
        }

        ctx.fillStyle = "rgb(255, 255, 255)";
        ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2 + Y_OFFSET);
        ctx.restore();
      }

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
